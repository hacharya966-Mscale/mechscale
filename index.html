*{margin:0;padding:0;box-sizing:border-box}

html{

}

}
::-webkit-scrollbar-thumb:hover {
background:var(--accent);
}

body{

}

}

nav a:hover{

}

z-index:-1;

margin-bottom:25px;

letter-spacing:0.05em;
}

.badge span {
width:6px;
height:6px;
background:var(--accent);
border-radius:50%;
display:inline-block;
animation:pulse 2s infinite;
}

@keyframes pulse {
0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.7); }
70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(var(--accent-rgb), 0); }
100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0); }
}

.hero h1{
font-size:clamp(2.8rem,6.5vw,5.5rem);
line-height:1.05;

font-weight:700;
letter-spacing:-0.04em;
}

-webkit-text-fill-color:transparent;
}

.hero p{

font-size:1.2rem;
line-height:1.7;
}

.btn{

margin-top:35px;

text-decoration:none;

font-weight:600;
box-shadow:0 4px 20px rgba(var(--accent-rgb), 0.25);

}

.btn:hover{
transform:translateY(-2px);
box-shadow:0 6px 24px rgba(var(--accent-rgb), 0.4);
opacity:0.95;
}

display:grid;

}

.stat{

border-radius:20px;

backdrop-filter:blur(5px);
}

.stat h3{
color:var(--accent);
font-size:2.5rem;
font-weight:700;
margin-bottom:5px;
}

.stat p {
font-size:0.95rem;
color:var(--muted);
}

padding:100px 8%;

margin-bottom:15px;
letter-spacing:-0.03em;
}

.section-sub{

color:var(--muted);
margin-bottom:60px;
font-size:1.1rem;
}
